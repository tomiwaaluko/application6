; PlatformIO Project Configuration File
;
; LidarSafe Technologies - Real-Time LIDAR Perception Prototype
;
; For local development and testing outside of Wokwi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Build flags for FreeRTOS configuration
build_flags = 
    -D CONFIG_FREERTOS_HZ=1000
    -D CORE_DEBUG_LEVEL=1

; Serial monitor filters
monitor_filters = 
    default
    time
    esp32_exception_decoder
